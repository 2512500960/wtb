<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B616B"/>
      <stop offset="1" stop-color="#9AA0A6"/>
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="256" cy="256" r="118"/>
    </clipPath>
  </defs>

  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#bg)"/>

  <!-- Globe background -->
  <circle cx="256" cy="256" r="118" fill="white" fill-opacity="0.08"/>
  <g clip-path="url(#globeClip)" opacity="0.28">
    <!-- latitude lines -->
    <ellipse cx="256" cy="256" rx="118" ry="118" stroke="white" stroke-width="3"/>
    <ellipse cx="256" cy="256" rx="118" ry="84" stroke="white" stroke-width="2"/>
    <ellipse cx="256" cy="256" rx="118" ry="46" stroke="white" stroke-width="2"/>

    <!-- longitude lines -->
    <ellipse cx="256" cy="256" rx="84" ry="118" stroke="white" stroke-width="2"/>
    <ellipse cx="256" cy="256" rx="46" ry="118" stroke="white" stroke-width="2"/>

    <!-- center meridian -->
    <path d="M256 138C270 170 278 210 278 256C278 302 270 342 256 374C242 342 234 302 234 256C234 210 242 170 256 138Z"
          stroke="white" stroke-width="2" fill="none"/>
  </g>

  <!-- W mark -->
  <path
    d="M128 170L176 342C180 356 200 356 204 342L256 220L308 342C312 356 332 356 336 342L384 170"
    stroke="white"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- top accent -->
  <rect x="218" y="132" width="76" height="32" rx="16" fill="white" fill-opacity="0.9"/>
</svg>